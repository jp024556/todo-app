name: Deploy to Statpio
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: NODE_OPTIONS=--openssl-legacy-provider npm run build
      - name: Create Build Archive
        run: cd dist && zip -r $GITHUB_WORKSPACE/build.zip .
      - name: Deploy to Statpio
        run: |
          set -euo pipefail
          oidc() { curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=statpio" | jq -r .value; }
          API="https://statpio.com/api/projects/acme"
          TICKET=$(curl --fail-with-body -sS -X POST "$API/deployments/uploads" \
            -H "Authorization: Bearer $(oidc)" -H "Content-Type: application/json" \
            -d "{\"size\":$(stat -c%s build.zip)}")
          UPLOAD_ID=$(echo "$TICKET" | jq -r .uploadId)
          curl --fail-with-body -sS -X PUT "https://statpio.com$(echo "$TICKET" | jq -r .uploadUrl)" \
            -H "Content-Type: application/zip" --data-binary @build.zip
          DEPLOY=$(curl --fail-with-body -sS -X POST "$API/deployments" \
            -H "Authorization: Bearer $(oidc)" -H "Content-Type: application/json" \
            -d "{\"uploadId\":\"$UPLOAD_ID\"}")
          ID=$(echo "$DEPLOY" | jq -r .deployment.id)
          # Deploys are unpacked a fixed number at a time: wait for this one (10 minutes at most)
          for i in $(seq 1 150); do
            STATUS=$(curl -sS "$API/deployments/$ID" -H "Authorization: Bearer $(oidc)" | jq -r .deployment.status)
            if [ "$STATUS" = "live" ]; then echo "Deployed: $ID"; exit 0; fi
            if [ "$STATUS" = "failed" ]; then echo "Deploy failed: $(curl -sS "$API/deployments/$ID" -H "Authorization: Bearer $(oidc)" | jq -r .deployment.errorMessage)"; exit 1; fi
            sleep 4
          done
          echo "The deploy is still queued after 10 minutes"; exit 1
